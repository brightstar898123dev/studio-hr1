name: "Outreach (weekdays 10:00 IST)"

# GitHub cron uses UTC. India Standard Time (IST) = UTC + 5:30.
on:
  schedule:
    - cron: "30 4 * * 1-5" # 10:00 IST, Monday to Friday
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cron-outreach
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Call the app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash .github/scripts/call-cron.sh outreach
